# GoReleaser configuration — https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: keyward
    binary: keyward
    main: ./cmd/keyward
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: keyward
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      - CHANGELOG.md

homebrew_casks:
  - name: keyward
    repository:
      owner: gateway-of-last-resort
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/gateway-of-last-resort/keyward"
    description: "Terminal UI for SSH keys, ~/.ssh/config, security audits, and encrypted backups"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
